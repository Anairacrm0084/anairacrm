name: Anaira Workers

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 * * * *"
    - cron: "*/10 * * * *"
    - cron: "*/15 * * * *"
    - cron: "30 2 * * *"
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run distribution sync worker
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/distribution/sync/worker"

  functional:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run CRM functional worker
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -X POST             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/crm/functional-worker"

  campaign:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run CRM campaign worker
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -X POST             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/crm/campaign-worker"

  reviews:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run Google reviews sync
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/reviews/sync"

  retention:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run review retention
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -X POST             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/reviews/retention"

  seo_automation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run SEO automation worker
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/seo/automation/worker"

  seo_reports:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Run SEO reports worker
        env:
          APP_URL: ${{ secrets.ANAIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 --retry-delay 5             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/seo/reports/worker"
